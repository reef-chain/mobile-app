name: reef_mobile_app
description: Reef Chain Wallet
publish_to: "none"
version: 1.1.1+33

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: 1.1.2
  qr_flutter: 4.0.0
  mobile_scanner: 6.0.6
  cupertino_icons: 1.0.8
  mobx: 2.5.0
  flutter_mobx: 2.3.0
  rxdart: 0.28.0
  webview_flutter: 4.10.0
  shared_preferences: 2.5.2
  google_fonts: 6.2.1
  gap: 3.0.1
  flutter_svg: 2.0.17
  jovial_svg: 1.1.25
  cached_network_image: 3.4.1
  restart_app: 1.3.2
  shimmer: 3.0.0
  url_launcher: 6.3.1
  intl: 0.20.2
  dotted_border: 2.1.0
  hive: 2.2.3
  hive_flutter: 1.1.0
  permission_handler: 11.3.1
  path_provider: 2.1.5
  flutter_secure_storage: 9.2.4
  bcrypt: 1.1.3
  http: 1.3.0
  local_auth: 2.3.0
  sliver_tools: 0.2.12
  flutter_localization: 0.3.1
  video_player: 2.9.2
  video_player_android: 2.7.17
  file_picker: 8.3.7
  reown_walletkit: 1.1.0
  flutter_local_notifications: 18.0.1
  sizer: 3.0.5
  reef_chain_flutter: 0.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  build_runner: 2.4.13
  flutter_launcher_icons: 0.14.3
  mobx_codegen: 2.7.0
  hive_generator: 2.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - lib/js/packages/reef-mobile-js/dist/index.js
    - assets/images/
    - assets/video/

flutter_icons:
  android: "reef_icon"
  ios: true
  image_path: "assets/images/reef.png"
  min_sdk_android: 21